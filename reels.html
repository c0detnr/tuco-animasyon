 const events=[];

 const bikes=scenes[1];event(bikes.start+.02,'engine');event(bikes.start+.26,'engine');event(bikes.start+1.65,'engineStop');

 const holland=scenes[5];for(let t=holland.start+.4;t<holland.end;t+=1.4)event(t,'whoosh');event(holland.cues[2].start+.2,'giggle');

 const ending=scenes[12];for(let i=1;i<=ending.cues[0].text.length;i++)event(ending.start+i*2.7/ending.cues[0].text.length,'type');
 event(ending.start+2,'ding');event(ending.start+2.8,'final');events.sort((a,b)=>a.time-b.time);

 const response=await fetch('assets/background-music.mp3');
 if(!response.ok)throw new Error('Arka plan müziği yüklenemedi');
 const musicBuffer=await ctx.decodeAudioData(await response.arrayBuffer());
 const background=ctx.createBufferSource();background.buffer=musicBuffer;background.loop=true;

 musicGain.gain.setValueAtTime(0,0);musicGain.gain.linearRampToValueAtTime(.19,1);

  if(['ending','narrator','whisper'].includes(cue.who))continue;
  const ids=cue.who==='both'?['x57','x56']:[cue.who];
  for(const id of ids){const profile=sound.profiles[id];if(!profile)continue;
   for(let at=cue.start/sourceRate,i=0;at<cue.end/sourceRate;at+=profile.interval,i++){

let playhead=0,playing=!renderMode,lastWall=null;
function seek(seconds){playhead=clamp(Number(seconds)||0,0,reelDuration);clock.t=Math.min(duration-1e-7,playhead*sourceRate);render();syncControls();}
function syncControls(){
 $('toggle').textContent=playing?'Duraklat':'Oynat';
 $('toggle').setAttribute('aria-label',playing?'Animasyonu duraklat':'Animasyonu oynat');
 $('progress').value=Math.round(playhead/reelDuration*1000);

const soundtrack=$('soundtrack');let soundEnabled=false;
